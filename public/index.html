<!DOCTYPE html>
<html lang="es" data-design="institucional">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="app-version" content="__APP_VERSION__" />

  <!-- FullCalendar -->
  <script src="https://cdn.jsdelivr.net/npm/@fullcalendar/core@6.1.15/index.global.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@fullcalendar/web-component@6.1.15/index.global.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@fullcalendar/daygrid@6.1.15/index.global.min.js"></script>

  <!-- iCal -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/ical.js/1.4.0/ical.min.js"></script>

  <title>Calendario de Salas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=Source+Serif+4:opsz,wght@8..60,560;8..60,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="designs.css">
</head>

<body>
  <div id="calendar"></div>

  <!-- Modal -->
  <div id="eventModal" class="modal">
    <div class="modal-content">
      <span class="close">&times;</span>
      <h2 id="modalTitle">Detalles de la Actividad</h2>
      <p><strong>Inicio:</strong> <span id="modalStart"></span></p>
      <p><strong>Fin:</strong> <span id="modalEnd"></span></p>
      <p><strong>Nombre Usuario / Actividad:</strong> <span id="modalDescription"></span></p>
      <p><strong>Ubicación:</strong> <span id="modalLocation"></span></p>
    </div>
  </div>

  <!-- Loader pantalla completa (FormPageLoader en form-loader.js) -->
  <script src="./form-loader.js"></script>
  <!-- TU SCRIPT -->
  <script src="./calendar-config.js"></script>
  <script src="./scripts.js"></script>
  <script src="./version-toast.js"></script>
</body>
</html>
